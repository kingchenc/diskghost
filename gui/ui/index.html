<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diskghost</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="ghost" aria-hidden="true">👻</span> Diskghost <span id="version" class="ver"></span></div>
        <form id="pathform" class="pathbox" autocomplete="off">
          <label class="sr-only" for="path" data-i18n="pathLabel">Folder path</label>
          <input id="path" type="text" spellcheck="false" data-i18n-ph="placeholder" />
          <button id="btn-browse" type="button" data-i18n="browse">Browse…</button>
          <button id="btn-scan" class="primary" type="submit" data-i18n="scan">Scan</button>
          <button id="btn-dupes" type="button" data-i18n="dupes">Find duplicates</button>
        </form>
        <button id="btn-excludes" class="chip-btn" type="button"></button>
        <button id="btn-settings" class="icon-btn" type="button" data-i18n-title="settings" aria-label="Settings">⚙</button>
      </header>

      <aside class="sidebar">
        <section class="side-sec">
          <div class="side-head">
            <h3 data-i18n="drives">Drives</h3>
            <button id="btn-drives-refresh" class="link-btn" type="button" data-i18n-title="refresh">↻</button>
          </div>
          <div id="drives" class="drives"></div>
          <button id="btn-scan-all" type="button" class="wide" data-i18n="scanAll">Scan all drives</button>
        </section>
        <section class="side-sec grow">
          <div class="side-head">
            <h3 data-i18n="scans">Scans</h3>
            <button id="btn-clear-done" class="link-btn" type="button" data-i18n="clearDone">Clear finished</button>
          </div>
          <div id="jobs" class="jobs"></div>
          <p class="hint" data-i18n="dropHint">Drop folders anywhere — each one is queued as its own scan.</p>
        </section>
      </aside>

      <main id="main" tabindex="-1"></main>

      <footer class="statusbar">
        <span id="status" role="status" aria-live="polite"></span>
        <span id="queue-info"></span>
      </footer>
    </div>

    <div id="dropzone" class="dropzone" aria-hidden="true">
      <div class="dropcard"><div class="dropicon">📂</div><div data-i18n="dropHere">Drop folders to scan them</div></div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <dialog id="settings-dlg" class="dlg"></dialog>
    <dialog id="confirm-dlg" class="dlg small"></dialog>

    <script src="lib.js"></script>
    <script src="app.js"></script>
  </body>
</html>
